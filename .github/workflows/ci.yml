name: ci

# Documented in README.md ("ci.yml — Lint (ruff, mypy, ESLint), unit tests") and CLAUDE.md
# ("lint + unit tests on every PR, no Docker, CLAUDE_CLI_MOCK=true").  The upload shipped no
# .github/ directory at all, so this file restores the documented contract.
#
# HONESTY NOTE: written to match the documented workflow; it has never executed, because this
# host has no Docker and the repository is not on GitHub.  Nothing here is claimed as "passing".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check app/ celery_app/ tests/
      - name: mypy
        # V21/L1: HARD gate.  This step carried `|| true` ("advisory while the reconstruction
        # settles"), so four real type errors — three in services/phone_send_service.py and one in
        # api/v1/runs.py — could never fail a job.  The three this lane owns are fixed at the
        # source; `[tool.mypy]` in pyproject.toml is the contract and a type error now fails CI.
        run: mypy app/

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLAUDE_CLI_MOCK: "true"
      SANDBOX_MODE: "true"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Unit tests with coverage report
        run: python -m pytest tests/unit -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        # `next lint` does not type-check, and the frontend job never runs `next build` (that lives in
        # docker-build.yml) — so without this step a type error reaches CI only through the Docker path.
        # This is exactly the gate that catches the class of bug that made `next build` fail here:
        # `dashboard/page.tsx` fed `unknown` into a `string | number` prop, which meant the documented
        # `docker compose up` could not build the frontend image even with every file present.
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test -- --watchAll=false
