name: integration

# Documented in README.md ("integration.yml — Integration tests (testcontainers), Playwright E2E
# on push to main") and CLAUDE.md.  The upload shipped no .github/ directory.
#
# W4-ship upgrade (S2-ci) of the e2e job below: `npm ci || npm install` (reproducible install,
# install as cold fallback), explicit `BASE_URL: http://localhost` (e2e/playwright.config.ts
# reads process.env.BASE_URL — the config default only hid the requirement), upload-artifact@v4
# of e2e/playwright-report + e2e/test-results on failure, and the `--reporter=list` CLI override
# dropped so the config's [html, list] reporters actually write the report that gets uploaded
# (the CLI flag REPLACES the config reporters).  Failures are never swallowed: a red e2e fails
# the run.  The card asked for a NEW e2e.yml — the restored tree already carries this documented
# e2e job, and README's CI table (README.md:235) names integration.yml as the Playwright home,
# so it was upgraded in place instead (S2-ci plan correction; a second file would duplicate the
# job and falsify that README row).
#
# HONESTY NOTE: never executed on this host (no Docker) — UNRUN.  The integration suite
# skips itself cleanly when testcontainers is absent (tests/integration/conftest.py), which is
# the behaviour this workflow relies on in CI.
#
# F4 (H10) applied to the e2e job's API wait: the probe now execs into the backend container — the
# old runner-side curl to :80 had no listener (nginx is excluded by the ci override and the backend
# publishes no port).  See the step's comment; still UNRUN (no Docker).

on:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLAUDE_CLI_MOCK: "true"
      SANDBOX_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements (includes testcontainers)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Integration tests (real Postgres + Redis via testcontainers)
        run: python -m pytest tests/integration -v -m integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for the API to answer
        # F4 (H10): the old probe curled http://localhost/api/v1/health from the runner.  The
        # ENDPOINT was right (health.py, no-auth, {"status":"ok"}), the LISTENER was not: this job
        # starts the stack with the ci override, which excludes nginx (`profiles: ["disabled"]`) and
        # publishes no backend port — nothing ever listened on :80, so the probe could not succeed.
        # Probe where the API actually serves: inside the backend container (uvicorn :8000; curl
        # ships in the image).  Retry loop kept (5 s × 60); exec noise while the container is still
        # starting is suppressed — the failure path dumps the stack logs.
        env:
          COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
        run: |
          for i in $(seq 1 60); do
            if ${COMPOSE} exec -T backend curl -fsS http://localhost:8000/api/v1/health >/dev/null 2>&1; then
              echo "api healthy"; exit 0
            fi
            sleep 5
          done
          echo "api never became healthy" >&2
          ${COMPOSE} logs --tail=200
          exit 1
      - name: Playwright
        # KNOWN RESIDUAL (recorded, not fixed in this lane — out of F4's named scope): with nginx
        # excluded by the ci override and no `ports:` published anywhere, this runner-side
        # BASE_URL cannot reach the stack yet; the RD10-e2eci receipt records it as a REQUESTS item.
        working-directory: e2e
        env:
          BASE_URL: http://localhost
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: Stack logs on failure
        if: failure()
        # Same -f flags as the `up` above: dump the logs of the stack that was actually started.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
