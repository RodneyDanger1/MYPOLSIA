events {
    worker_connections 1024;
}

http {
    # V18 smoke finding: the default leaks the nginx build version in `Server:` — a version banner
    # is free reconnaissance for exploit pickers.  Off at http scope covers every vhost/include.
    server_tokens off;
    # Wave v14 / U1-F2: Docker's embedded DNS. With a static `upstream backend { server backend:8000; }`
    # nginx resolved the name ONCE at startup and kept that IP forever — recreating the backend
    # container (new IP) left nginx proxying a dead address, so every /api and /ws request 502'd
    # until nginx itself was restarted (observed: 87x502 + 11x503 in the access log, incl.
    # `connect() failed (111: Connection refused) ... upstream: "http://172.18.0.6:8000/api/v1/agents/status"`
    # while the API was being rebuilt). Resolving per request through a variable proxy_pass keeps
    # nginx correct across container recreation, without recreating nginx.
    # Trade-off (accepted, wave v13 u1-runtime F2): a variable proxy_pass cannot use an upstream{}
    # block, so there is no keepalive pool for the two services — this stack is one user on loopback.
    # (Alternative, if the upstream{} form is preferred: deploy via `docker compose up -d
    # --force-recreate nginx` whenever backend is recreated.)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── 2R-01 / U2-06: rate limiting on the PUBLIC routes ─────────────────────────────────────
    # The audit found NO rate limit anywhere (repo grep at b17d7b0: 0 hits) — the public,
    # unauthenticated endpoints took unbounded bursts (the named case: unsubscribe).  Two zones,
    # keyed on the client address:
    #   public_burst  — the public read/act routes (health, unsubscribe): 30 r/m.
    #   webhook_burst — the Stripe webhook.  Stripe retries with its own backoff and re-sends
    #                   legitimately; dropping a signature-verified webhook would lose payment
    #                   data, so it gets a wider budget instead of the read-route one.
    # The PUBLIC set is enumerated from the S4 66-route auth matrix (wave-v13/s4-errors
    # FINDINGS.md: "Public: /, /api/v1/health, /api/v1/finance/stripe/webhook
    # (signature-verified), /api/v1/outreach/unsubscribe (token-verified)").  The API's `GET /`
    # root is NOT proxied here (this mux sends `/` to the frontend), so the three
    # nginx-reachable public API routes are limited below, node by node.
    # Stated honestly: this deployment binds 127.0.0.1:80 only (compose, V7-T08), so every client
    # address today is loopback and each zone is effectively ONE bucket — the limiter still
    # bounds runaway loopback clients (a retry loop / scripted abuse), which is what can reach it.
    # /ws/ and the keyed /api/ routes are deliberately OUT of the burst class (TASK-LIST 2R-01).
    limit_req_zone $binary_remote_addr zone=public_burst:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=webhook_burst:10m rate=120r/m;
    # 429 — the status app/core/errors.py already maps to E_RATE_LIMITED ("back off; the limiter
    # will retry after the window resets"); the nginx default (503) would read as an outage.
    limit_req_status 429;

    server {
        listen 80;

        # ── 2R-08 / V2+V3 handoff: response hardening for every proxied surface ───────────────
        # Defined at SERVER scope on purpose: nginx applies server-level add_header to every
        # location that does not declare its own, so `/` (the Next app), `/api/` and the rest are
        # covered by one block — and the lane pins assert no location-level add_header exists to
        # silently drop that inheritance (a location-level add_header would REPLACE this set, not
        # merge).  `always` so refusals (4xx/5xx) carry the headers too.
        # Every CSP source names a real consumer in this tree:
        #   default-src 'self'                — nothing may load from another origin unless listed
        #   script-src 'self' 'unsafe-inline' — Next.js 14 inlines its bootstrap/flight payload;
        #                                       self-hosted /_next chunks are covered by 'self';
        #                                       'unsafe-eval' is deliberately NOT granted (the
        #                                       production build needs none, so none is offered)
        #   style-src 'self' 'unsafe-inline'  — Next/Tailwind style tags plus React `style={{...}}`
        #                                       attributes (e.g. app/global-error.tsx) are blocked
        #                                       without it
        #   img-src 'self' data:              — no <img>/next-image consumer of a remote image
        #                                       exists in the tree (grep: zero <img> tags); data:
        #                                       covers inline data-URI images; https: is NOT
        #                                       granted because nothing loads one
        #   font-src 'self' data:             — next/font self-hosts its files under /_next/static
        #   connect-src 'self' ws: wss:       — the same-origin API fetches + the activity-feed
        #                                       WebSocket (useActivityFeed builds ws://<host>/ws/...)
        #   frame-ancestors 'self'            — no third-party framing (belt to X-Frame-Options)
        #   base-uri/form-action/object-src   — block <base> hijacks, cross-origin form posts and
        #                                       plugin embeds (none exist)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # The service addresses are VARIABLES so the resolver above is consulted per request — a
        # literal name in proxy_pass is resolved once, at startup, and gone stale after a rebuild.
        set $backend_up backend:8000;
        set $frontend_up frontend:3000;

        # 2R-01: the three public API routes get the burst class.  Exact-match (`=`) locations so
        # the limiter applies to THESE paths and nothing else; `nodelay` because a public route
        # should answer immediately within its burst budget and only then 429 — the queued form
        # would silently delay (e.g.) the unsubscribe page instead of deciding.
        location = /api/v1/health {
            limit_req zone=public_burst burst=10 nodelay;
            proxy_pass http://$backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/outreach/unsubscribe {
            limit_req zone=public_burst burst=10 nodelay;
            proxy_pass http://$backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/finance/stripe/webhook {
            limit_req zone=webhook_burst burst=30 nodelay;
            proxy_pass http://$backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2R-01: a rate-limited request answers in the platform's named-refusal envelope — the
        # frontend's isRefusal() parses {"ok":false,"error":{code,...}}; a bare nginx 429 would
        # surface as an unnamed HTTP status.  E_RATE_LIMITED is the code errors.py maps to 429.
        # (The named location carries no limit_req of its own — no recursion, no double count.)
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"ok":false,"error":{"code":"E_RATE_LIMITED","message":"rate limit exceeded for this route","how_to_fix":"back off and retry once the rate window resets; the limits are the limit_req_zone rates in nginx/nginx.conf","context":{}}}';
        }

        # WebSocket upgrade
        location /ws/ {
            # 2R-03 / W1 (U2-08 + U1-F3, WS half): the API key rides the WS query string
            # (`/ws/activity?key=...` — frontend useActivityFeed.ts:68-72) and the default access
            # log records the FULL request line, i.e. the key in plaintext (confirmed by live
            # nginx.log lines).  Turning the log OFF for this one location removes the logged
            # credential while the URL contract stays unchanged — no FE change rides with it.
            # The durable fix is the named alternative, not built this wave: a short-lived
            # single-use WS ticket (minted by the backend, redeemed once in api/v1/ws.py) so the
            # long-lived key never appears in a URL at all.
            access_log off;
            proxy_pass http://$backend_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # API
        location /api/ {
            proxy_pass http://$backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10M;
        }

        # ── V21/L1: the API's OWN docs, reachable through the proxy ────────────────────────────
        # Why this exists: FastAPI serves its Swagger UI at `/docs` and the schema at
        # `/openapi.json`, but `location /` below sends BOTH to the Next app — neither path is a
        # Next route in this tree (`frontend/src/app` has no `docs` page, so `/docs` 404s there) —
        # so the API's own docs were unreachable through nginx (the smoke docs check SKIPped every
        # wave).  `/apidocs` is a NEW public path that maps onto the backend's EXISTING `/docs`, so
        # this API's route table does not change at all
        # (`tests/parity/test_api_surface_parity.py` stays exact) and the frontend keeps whatever
        # it serves at `/docs`.  Both routes inherit the 2R-02 sandbox gate: with SANDBOX_MODE=false
        # the backend answers 404 and this proxy passes that 404 through — hiding docs stays
        # possible, it is just no longer accidental.
        location = /apidocs {
            proxy_pass http://$backend_up/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Swagger UI loads its JS/CSS from cdn.jsdelivr.net (FastAPI's defaults) and its
            # favicon from fastapi.tiangolo.com.  The server-scope CSP above allows only
            # 'self', which would block them: the page would answer 200 and render BLANK — a
            # false success.  A location-level add_header REPLACES the inherited set, so this
            # block repeats the other two headers and widens ONLY script/style/img for the
            # docs page.  eval is still not granted.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # The schema the page fetches from the browser at THIS origin.  No add_header here on
        # purpose: the server-scope hardening applies to the schema response unchanged.
        location = /openapi.json {
            proxy_pass http://$backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── V24/L3: the website builder's PUBLIC output ────────────────────────────────────────
        # `http://<host>/sites/<slug>/` serves a generated static page from the backend's
        # StaticFiles mount (app/main.py).  Only the TRAILING-SLASH prefix is proxied: the exact
        # `/sites` path stays the frontend's Sites page — that split is the reason this location
        # is `/sites/`, not `/sites`.
        #
        # V24 settle: an EXACT-match location for `/sites` is REQUIRED, not stylistic.  With only
        # the prefix location below, nginx answers `/sites` itself with a 301 to `/sites/`
        # (observed live: the page was unreachable and the redirect landed on the static mount's
        # 404).  Exact matches are evaluated before prefix locations, so this one hands the page
        # to Next; the prefix keeps every generated site on the backend.
        location = /sites {
            proxy_pass http://$frontend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        #
        # CSP: this block deliberately adds NO location-level `add_header`.  A location-level
        # add_header REPLACES the inherited server-scope set (nginx merges nothing), and the
        # server-scope policy is already correct for a generated page: `default-src 'self'` permits
        # the page's ONE same-origin stylesheet, `script-src` is never exercised (the generator
        # emits no script at all), `img-src 'self' data:` covers an inline data URI, and
        # `frame-ancestors 'self'` + `X-Frame-Options SAMEORIGIN` allow the owner's own /sites
        # page to preview the site in an iframe while refusing third-party framing.  Inheriting
        # keeps ONE policy for the whole deployment instead of a second copy that could drift.
        location /sites/ {
            proxy_pass http://$backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend (everything else)
        location / {
            proxy_pass http://$frontend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
