[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 is not enforced: the formatter owns line length and the sources are wrapped by hand.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 (function-call-in-default-argument) is a documented FALSE POSITIVE for FastAPI: `Depends(get_db)`
# and `Query(...)` in a signature default ARE the framework's dependency-injection API. All 21 sites are
# FastAPI parameter defaults in app/api/v1/; the `Annotated[...]` spelling is a style migration, not a
# defect fix, so it is left as a follow-up instead of churning every handler signature in this pass.
"app/api/v1/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
# The sqlalchemy plugin is what lets mypy tell a mapped CLASS attribute (a Column object) from an
# INSTANCE attribute (its value). Without it, every `row.id` reads as `Column[int]` and the run reports
# ~20 phantom "Column[int] is not int" errors that hide the real findings.
# The upload ships an `__init__.py` at the REPOSITORY ROOT, which makes mypy treat every parent
# directory as a package: it then resolves `app/agents/integrations.py` TWICE (as
# `Polsia.backend.app.agents.integrations` and as `app.agents.integrations`) and ABORTS the run with
# "errors prevented further checking" — so `mypy app/` never checked a single line while reporting a
# failure. Naming the package bases explicitly fixes the resolution without deleting an upload file.
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "integration: marks tests that require real DB/Redis (deselect with '-m not integration')"
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
# Truthful attribution for async route bodies. The default C tracer does not credit the final
# statement of async endpoints through the ASGI/httpx test path (R26/R27/R28 measured phantom
# lines and "missing" executed lines; repro probes in the bs5-closeout + lane raw/ dirs). sysmon
# credits them and needs CPython >= 3.12 — the venv, backend/Dockerfile and every CI workflow are.
core = "sysmon"

[tool.coverage.report]
# MEASURED, not aspirational — and it is a RATCHET, so it only ever moves up.
# 2026-10-11, first measurement: 51.48% (2,267 of 4,404 statements) against the upload's declared
# `fail_under = 75`, which no run of this repository had ever met. A gate that cannot pass protects
# nothing, so it was set to the measured floor; the suite then grew (queue safety core, model schema
# freeze, auth refinements) to 57.6% (2,554 of 4,431), then through waves 1–4 and T16–T19 to 73.0%
# (3,441 of 4,714 — 72.9953%, floored to 72). 2026-10-13: the R17–R32 hardening waves grew it to
# 87.5461% (4,984 of 5,693; `pytest tests/unit tests/parity tests/redteam --cov=app`, the sysmon
# core pinned above) — the originally-declared 75% target is now MET; the floor moves to 87.
fail_under = 90  # V21: measured 92.08% on the V21 tree (11,678 stmts / 925 missed, CI's exact command: `pytest tests/unit -q --cov=app --cov-report=term-missing`, CLAUDE_CLI_MOCK/SANDBOX_MODE/DATABASE_URL as CI sets them) — raised 88→90
show_missing = true
