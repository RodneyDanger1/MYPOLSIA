services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polsia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polsia_password}
      POSTGRES_DB: ${POSTGRES_DB:-polsia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polsia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-polsia}:${POSTGRES_PASSWORD:-polsia_password}@postgres:5432/${POSTGRES_DB:-polsia}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # wave V16 (E5/P-01 wiring FIX, found in the live drill with the real store): the HOST path
      # in .env drives the bind-mount SOURCE; inside the container the store is ALWAYS at the mount
      # target /phone-link.  env_file injects PHONE_LINK_DB_DIR as the host path, so this line must
      # override it — without the override the service looked for 'C:/Users/...' inside the Linux
      # container and every phone route refused E_PHONE_UNAVAILABLE ("contacts.db is missing")
      # despite a healthy mount.  (On beat this var is inert; set for env consistency.)
      PHONE_LINK_DB_DIR: /phone-link
    volumes:
      # /app/data carries runtime state incl. the DeepSeek key store (DEEPSEEK_KEY_FILE default
      # data/deepseek_api_key.json); the chroma store nests under it (deepest path mounts last).
      - backend_data:/app/data
      - chroma_data:/app/data/chroma
      - ~/.claude:/root/.claude:ro
      # wave V16 (E5/P-01): the Phone Link store — READ-ONLY (`read_only: true`; the service also
      # opens every database with SQLite's `mode=ro`, so a write is refused by the store, not by
      # discipline).  `PHONE_LINK_DB_DIR` is the HOST path to the Phone Link app's database
      # directory (see .env.example; per-machine, hence env-driven); the container path is FIXED
      # at /phone-link.  The default `/dev/null` is deliberate: a machine without Phone Link still
      # brings the stack up unchanged, and the phone surface then refuses BY NAME
      # (`E_PHONE_UNAVAILABLE`) instead of serving an empty inbox.  Long form on purpose — a
      # Windows `C:\...` source contains a colon and the short `src:dst:ro` syntax mis-parses it.
      - type: bind
        source: ${PHONE_LINK_DB_DIR:-/dev/null}
        target: /phone-link
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # F1 (H10): the backend was the one service in this stack with no healthcheck anywhere (compose
    # nor Dockerfile), so `docker compose ps` could not tell a live API from a crashed one and no
    # dependent could gate on it.  The probe is the EXISTING no-auth liveness endpoint —
    # GET /api/v1/health (backend/app/api/v1/health.py, mounted at /api/v1 by
    # backend/app/main.py:119-121) — on the port uvicorn serves; curl is already in the image
    # (backend/Dockerfile installs it).  start_period gives migrations/boot room so a slow start
    # does not read as a failure.  A green healthcheck is not evidence of correctness — it is what
    # makes the `condition: service_healthy` gates on frontend/nginx below meaningful.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-polsia}:${POSTGRES_PASSWORD:-polsia_password}@postgres:5432/${POSTGRES_DB:-polsia}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # wave V16 (E5/P-01 wiring FIX, found in the live drill with the real store): the HOST path
      # in .env drives the bind-mount SOURCE; inside the container the store is ALWAYS at the mount
      # target /phone-link.  env_file injects PHONE_LINK_DB_DIR as the host path, so this line must
      # override it — without the override the service looked for 'C:/Users/...' inside the Linux
      # container and every phone route refused E_PHONE_UNAVAILABLE ("contacts.db is missing")
      # despite a healthy mount.  (On beat this var is inert; set for env consistency.)
      PHONE_LINK_DB_DIR: /phone-link
    volumes:
      # /app/data carries runtime state incl. the DeepSeek key store (DEEPSEEK_KEY_FILE default
      # data/deepseek_api_key.json); the chroma store nests under it (deepest path mounts last).
      - backend_data:/app/data
      - chroma_data:/app/data/chroma
      - ~/.claude:/root/.claude:ro
      # wave V16 (E5/P-01): the Phone Link store — READ-ONLY (`read_only: true`; the service also
      # opens every database with SQLite's `mode=ro`, so a write is refused by the store, not by
      # discipline).  `PHONE_LINK_DB_DIR` is the HOST path to the Phone Link app's database
      # directory (see .env.example; per-machine, hence env-driven); the container path is FIXED
      # at /phone-link.  The default `/dev/null` is deliberate: a machine without Phone Link still
      # brings the stack up unchanged, and the phone surface then refuses BY NAME
      # (`E_PHONE_UNAVAILABLE`) instead of serving an empty inbox.  Long form on purpose — a
      # Windows `C:\...` source contains a colon and the short `src:dst:ro` syntax mis-parses it.
      - type: bind
        source: ${PHONE_LINK_DB_DIR:-/dev/null}
        target: /phone-link
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # F1: the backend image now carries a HEALTHCHECK (backend/Dockerfile).  These workers serve no
    # HTTP, so the inherited probe would flag them permanently unhealthy — disable it for both
    # non-API consumers of the image.
    healthcheck:
      disable: true
    command: celery -A celery_app.worker worker --loglevel=info --concurrency=4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-polsia}:${POSTGRES_PASSWORD:-polsia_password}@postgres:5432/${POSTGRES_DB:-polsia}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # wave V16 (E5/P-01 wiring FIX, found in the live drill with the real store): the HOST path
      # in .env drives the bind-mount SOURCE; inside the container the store is ALWAYS at the mount
      # target /phone-link.  env_file injects PHONE_LINK_DB_DIR as the host path, so this line must
      # override it — without the override the service looked for 'C:/Users/...' inside the Linux
      # container and every phone route refused E_PHONE_UNAVAILABLE ("contacts.db is missing")
      # despite a healthy mount.  (On beat this var is inert; set for env consistency.)
      PHONE_LINK_DB_DIR: /phone-link
    volumes:
      - celery_beat_data:/app/celerybeat
      - ~/.claude:/root/.claude:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # F1: same as celery_worker above — beat runs no HTTP server; the image's inherited HEALTHCHECK
    # must not apply to it.
    healthcheck:
      disable: true
    command: celery -A celery_app.worker beat --loglevel=info --schedule /app/celerybeat/celerybeat-schedule
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time — they are NOT read at
        # runtime, so the old `environment:` block here was inert and misleading (removed in the
        # 2026-10-13 live pass).  URL/WS args DEFAULT TO EMPTY = RELATIVE: the browser calls
        # /api/v1 on whatever origin serves the app through the nginx mux (works from localhost,
        # 127.0.0.1, a LAN IP or a hostname alike).  API_KEY must match the backend's.
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-dev-key}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    env_file: .env
    # F1: with the backend healthcheck above, gate on it — the pages call the API on first render,
    # so "container started" was never enough (a crashed backend used to start the frontend anyway).
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # V7-T08 (D1): published on the loopback interface only — never on every host NIC.
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # F1: same gate — nginx is the entry point; it must not come up before the API it proxies.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── 5-04 (#8 LOCKED): the SCHEDULED daily backup (compose-sidecar route, parent decision) ────
  # `make backup` stays the on-demand path and is UNTOUCHED; this service is the scheduler it
  # never had.  It runs scripts/backup.sh (mounted read-only) in a postgres:16-alpine container —
  # pg_dump's major version must match the server it dumps, and this stack's server IS
  # postgres:16.  No docker socket and no docker CLI inside the container: the database is read
  # over the compose network (PGHOST=postgres) and each DATA volume is mounted READ-ONLY (a
  # volume mount is a directory, so plain `tar` is the whole story — and a backup process must
  # never be able to write to what it is archiving).  Artifacts land in ./backups — the same
  # gitignored directory `make backup` writes.  Cadence/retention are the env knobs below;
  # README.md ("Volumes & Backup") documents both plus the restore drill.
  backup:
    image: postgres:16-alpine
    # docker-entrypoint.sh would try to INITIALIZE A DATABASE here — this container is a timer,
    # not a server, so the script is the whole entrypoint.
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    env_file: .env
    environment:
      PGHOST: postgres
      # pg_dump's password; matches the postgres service's own default above
      PGPASSWORD: ${POSTGRES_PASSWORD:-polsia_password}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      # One READ-ONLY mount per DATA volume (the same four `make backup` snapshots).
      - backend_data:/volumes/backend_data:ro
      - chroma_data:/volumes/chroma_data:ro
      - redis_data:/volumes/redis_data:ro
      - celery_beat_data:/volumes/celery_beat_data:ro
    depends_on:
      postgres:
        condition: service_healthy
    # F1: same as celery_worker/beat — this container serves no HTTP; the image's inherited
    # HEALTHCHECK must not flag it permanently unhealthy.
    healthcheck:
      disable: true
    # A cycle can be mid-pg_dump/tar when the stack stops.  30s beats the 10s default, and the
    # .part naming means even a SIGKILLed cycle leaves a recognizable partial, never a fake
    # artifact (a real .sql/.tgz only ever appears via rename-after-success).
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  celery_beat_data:
  backend_data:
